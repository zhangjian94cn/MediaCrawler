# ==================== 全局设置 ====================
global_settings:
  login_type: qrcode      # 登录方式: qrcode, phone, cookie
  headless: false         # 是否无头模式
  save_format: json       # 保存格式: json, csv, db, sqlite, excel
  get_comments: false      # 是否抓取评论
  max_comments: 10        # 每个帖子最多抓取评论数
