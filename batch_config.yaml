# MediaCrawler 批量抓取配置文件
# 配置格式说明：
#   - name: 任务名称（用于日志和文件夹命名）
#   - platform: 平台 (dy=抖音, xhs=小红书, bili=B站, ks=快手, wb=微博)
#   - type: 抓取类型 (creator=创作者主页, search=关键词搜索, detail=指定帖子)
#   - ids: 账号ID或URL列表（creator模式用）
#   - keywords: 关键词列表（search模式用）
#   - save_dir: 自定义保存目录（可选，不填则使用默认 data/{platform}）
#   - get_media: 是否下载视频/图片 (true/false)
#   - max_notes: 最大抓取数量

# ==================== 抖音账号抓取配置 ====================
douyin_creators:
  # 示例1：抓取某个抖音博主的所有视频
  # - name: "自己装逼的路飞"
  #   platform: dy
  #   type: creator
  #   ids:
