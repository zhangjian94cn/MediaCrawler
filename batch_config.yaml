  #   save_dir: "/Volumes/video-02-documentary/抖音/自己装逼的路飞"  # 留空使用默认路径: data/douyin/
  #   get_media: true  # 是否下载视频
  #   max_notes: 2000    # 最多抓取50个视频

  # 示例1：抓取某个抖音博主的所有视频
